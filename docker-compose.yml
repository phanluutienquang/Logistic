version: '3.8'

services:
  web:
    image: YOUR_DOCKERHUB_USERNAME/logistic-app:latest
    container_name: logistic_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=xinsuju_dev
      - DB_USERNAME=test
      - DB_PASSWORD=123456
    depends_on:
      - db
    networks:
      - logistic_network

  db:
    image: mysql:8.0
    container_name: logistic_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: xinsuju_dev
      MYSQL_USER: test
      MYSQL_PASSWORD: 123456
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - logistic_network

networks:
  logistic_network:
    driver: bridge

volumes:
  dbdata: